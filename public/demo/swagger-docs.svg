<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" rx="16" fill="#0B1120"/>
  <rect x="32" y="32" width="1136" height="70" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="60" y="74" fill="#85EA2D" font-family="system-ui, sans-serif" font-size="22" font-weight="700">ViTree API - Swagger OpenAPI 3.0 Documentation</text>
  <text x="800" y="74" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Base URL: http://localhost:3001/api/docs</text>

  <!-- Tag 1: Auth -->
  <rect x="32" y="125" width="1136" height="85" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="52" y="145" width="70" height="45" rx="6" fill="#10B981"/>
  <text x="68" y="174" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">POST</text>
  <text x="140" y="172" fill="#F8FAFC" font-family="monospace" font-size="16" font-weight="600">/api/auth/login</text>
  <text x="360" y="172" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">&Dstrok;&abreve;ng nh&#7853;p &dstrok;&#7875; l&#7845;y th&#7867; Token (JWT Bearer Token)</text>

  <!-- Tag 2: Members -->
  <rect x="32" y="225" width="1136" height="235" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="255" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Members &bull; Qu&#7843;n L&yacute; Th&agrave;nh Vi&ecirc;n Gia Ph&#7843; (Bearer Auth)</text>

  <rect x="52" y="275" width="60" height="32" rx="4" fill="#0284C7"/>
  <text x="65" y="297" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GET</text>
  <text x="130" y="296" fill="#F8FAFC" font-family="monospace" font-size="14">/members</text>
  <text x="300" y="296" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">L&#7845;y danh s&aacute;ch th&agrave;nh vi&ecirc;n (ph&acirc;n trang page/limit, l&#7885;c theo generation)</text>

  <rect x="52" y="315" width="60" height="32" rx="4" fill="#10B981"/>
  <text x="62" y="337" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">POST</text>
  <text x="130" y="336" fill="#F8FAFC" font-family="monospace" font-size="14">/members</text>
  <text x="300" y="336" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">T&#7841;o m&#7899;i m&#7897;t th&agrave;nh vi&ecirc;n (validate quan h&#7879; ph&#7909; th&acirc;n, m&#7851;u th&acirc;n, ph&#7889;i ng&#7851;u)</text>

  <rect x="52" y="355" width="60" height="32" rx="4" fill="#0284C7"/>
  <text x="65" y="377" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GET</text>
  <text x="130" y="376" fill="#F8FAFC" font-family="monospace" font-size="14">/members/{id}</text>
  <text x="300" y="376" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">L&#7845;y th&ocirc;ng tin chi ti&#7871;t m&#7897;t th&agrave;nh vi&ecirc;n k&egrave;m populate quan h&#7879;</text>

  <rect x="52" y="395" width="60" height="32" rx="4" fill="#EAB308"/>
  <text x="58" y="417" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PATCH</text>
  <text x="130" y="416" fill="#F8FAFC" font-family="monospace" font-size="14">/members/{id}</text>
  <text x="300" y="416" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">C&#7853;p nh&#7853;t th&ocirc;ng tin th&agrave;nh vi&ecirc;n</text>

  <rect x="52" y="435" width="60" height="32" rx="4" fill="#EF4444"/>
  <text x="56" y="457" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DELETE</text>
  <text x="130" y="456" fill="#F8FAFC" font-family="monospace" font-size="14">/members/{id}</text>
  <text x="300" y="456" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">X&oacute;a m&#7897;t th&agrave;nh vi&ecirc;n v&agrave; c&#7853;p nh&#7853;t to&agrave;n v&#7865;n quan h&#7879; li&ecirc;n quan</text>

  <!-- Tag 3: Upload -->
  <rect x="32" y="480" width="1136" height="75" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="52" y="500" width="60" height="35" rx="4" fill="#0284C7"/>
  <text x="65" y="523" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GET</text>
  <text x="130" y="522" fill="#F8FAFC" font-family="monospace" font-size="14">/upload/signature</text>
  <text x="300" y="522" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">C&#7845;p ch&#7919; k&yacute; s&#7889; Cloudinary Upload Signature an to&agrave;n kh&ocirc;ng l&#7897; Secret Key</text>

  <!-- Tag 4: Users -->
  <rect x="32" y="570" width="1136" height="75" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="52" y="590" width="60" height="35" rx="4" fill="#10B981"/>
  <text x="62" y="613" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">POST</text>
  <text x="130" y="612" fill="#F8FAFC" font-family="monospace" font-size="14">/api/users/register</text>
  <text x="300" y="612" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Kh&#7903;i t&#7841;o t&agrave;i kho&#7843;n qu&#7843;n tr&#7883; vi&ecirc;n b&#7843;o m&#7853;t v&#7899;i bcrypt hashing</text>
</svg>